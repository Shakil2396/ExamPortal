spring:
  application:
    name: service-registry
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8761

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

  server:
    enable-self-preservation: true
    wait-time-in-ms-when-sync-empty: 0

